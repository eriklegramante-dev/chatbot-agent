services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: math_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env 
    networks:
      - app-network

  frontend:
    build:
      context: ../ai-chatbot-frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: math_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge