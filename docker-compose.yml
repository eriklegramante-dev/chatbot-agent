services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: math_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PYTHONUNBUFFERED=1
      - DISABLE_PROMPT_CACHING=True
    networks:
      - app-network

  frontend:
    build:
      context: ../ai-chatbot-frontend     
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: math_frontend
    ports:
      - "3000:3000"
    volumes:
      - ../ai-chatbot-frontend:/app       
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge